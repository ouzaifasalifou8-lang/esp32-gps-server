<!DOCTYPE html>
<html>
<head>
    <title>Tracker Ma Voiture</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Initialisation de la carte
        var map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Création de l'icône voiture
        var carIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/744/744465.png', // Icône de voiture
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        });

        var marker = L.marker([0, 0], {icon: carIcon}).addTo(map);

        async function updatePos() {
            try {
                // On récupère la trame depuis ton API Vercel
                const res = await fetch('/api/gps');
                const trame = await res.text();
                
                if (trame.includes("$GPRMC")) {
                    const p = trame.split(",");
                    // Conversion Latitude/Longitude (même logique que ton code Java)
                    let lat = (parseInt(p[3].substring(0,2)) + parseFloat(p[3].substring(2))/60) * (p[4] === 'S' ? -1 : 1);
                    let lon = (parseInt(p[5].substring(0,3)) + parseFloat(p[5].substring(3))/60) * (p[6] === 'W' ? -1 : 1);
                    
                    const newPos = [lat, lon];
                    marker.setLatLng(newPos);
                    map.setView(newPos, 17); // Zoom sur la voiture
                }
            } catch (e) { console.error("Erreur de mise à jour"); }
        }

        setInterval(updatePos, 5000); // Mise à jour auto toutes les 5 secondes
        updatePos();
    </script>
</body>
</html>
